name: Build installers (macOS DMG + Windows exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: read-only by default; only the step that attaches files to a release can write.
permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15 # Apple Silicon runner -> arm64 build
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck and test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build DMG
        run: npm run dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentopia-dmg
          path: release/*.dmg
          if-no-files-found: error

      - name: Attach DMG to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*.dmg

  exe:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck and test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build exe
        run: npm run dist:win

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentopia-exe
          path: release/*.exe
          if-no-files-found: error

      - name: Attach exe to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*.exe
