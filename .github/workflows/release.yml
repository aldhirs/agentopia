name: Build installers (macOS DMG + Windows exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14 # Apple Silicon runner -> arm64 build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck and test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build DMG
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: agentopia-dmg
          path: release/*.dmg
          if-no-files-found: error

      - name: Attach DMG to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck and test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build exe
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: agentopia-exe
          path: release/*.exe
          if-no-files-found: error

      - name: Attach exe to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
