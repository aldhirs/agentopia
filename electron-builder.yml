appId: app.virtualoffice.desktop
productName: Virtual Office
copyright: Virtual Office

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # The performance harness is a dev tool, not part of the app.
  - '!out/renderer/perf.html'
  - '!out/renderer/assets/perf-*'

# node-pty is a native module: its .node binary and spawn-helper must live outside the asar archive.
asarUnpack:
  - node_modules/node-pty/**

npmRebuild: false

# Electron fuses: switch off ways to turn the app binary into a generic Node/debug runtime.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # No Apple Developer certificate for internal use: ad-hoc sign so Apple Silicon will run it.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # No Windows code-signing certificate: SmartScreen will warn on first run (see docs/INSTALL.md).

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Virtual Office
  artifactName: Virtual-Office-Setup-${version}-${arch}.${ext}

dmg:
  title: Virtual Office ${version}
  artifactName: Virtual-Office-${version}-${arch}.dmg
